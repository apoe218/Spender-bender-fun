<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07130e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spender Bender">
<title>Spender Bender</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%81%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#07130e; --bg2:#0b1d14; --card:#0f2419; --card2:#153222; --line:#1f4630;
  --text:#e9f5ec; --muted:#8fb09b; --green:#2f8f5b; --mint:#7be0a6;
  --red:#e5586a; --gold:#f2c14e; --radius:18px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif}
body{min-height:100vh;background:
  radial-gradient(900px 400px at 85% -10%,rgba(47,143,91,.28),transparent 60%),
  radial-gradient(700px 400px at -10% 10%,rgba(229,88,106,.10),transparent 60%),var(--bg);
  background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--mint);text-decoration:none}
#app{max-width:640px;margin:0 auto;padding:16px 16px calc(96px + var(--safe-b))}
h1,h2,h3{margin:0}

/* header */
.hero{padding:6px 2px 14px}
.brand{display:flex;justify-content:space-between;align-items:center}
.brand h1{font-size:22px;letter-spacing:.2px}
.brand h1 span{color:var(--mint)}
.count{font-size:13px;color:var(--gold);background:rgba(242,193,78,.1);border:1px solid rgba(242,193,78,.3);padding:4px 10px;border-radius:99px;white-space:nowrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.stat small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.stat b{display:block;font-size:22px;margin-top:2px}
.stat.warn b{color:var(--red)}
.stat.good b{color:var(--mint)}
.bar{height:8px;background:#0a1a12;border-radius:99px;overflow:hidden;margin-top:12px;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--mint));border-radius:99px;transition:width .4s}
.bar i.over{background:linear-gradient(90deg,#c0394b,var(--red))}
.bar i.plan{background:repeating-linear-gradient(45deg,var(--green),var(--green) 6px,#287a4e 6px,#287a4e 12px)}
.barwrap{position:relative}
.barlbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}

/* cards */
.sec{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}
.sec h2{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card.tap{cursor:pointer}
.card.tap:active{transform:scale(.99)}
.prow{display:flex;gap:12px;align-items:center}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center;font-size:24px;flex:none}
.grow{flex:1;min-width:0}
.name{font-weight:650;font-size:17px}
.sub{color:var(--muted);font-size:13px}
.right{text-align:right;flex:none}
.right b{font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);color:var(--muted)}
.chip.btn{cursor:pointer;color:var(--text)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.chip.link{color:var(--mint);border-color:rgba(123,224,166,.35)}
.chip.drop{color:var(--mint);border-color:rgba(123,224,166,.4);background:rgba(123,224,166,.08)}
.chip.rise{color:var(--red);border-color:rgba(229,88,106,.4);background:rgba(229,88,106,.08)}
.chip.target{color:var(--gold);border-color:rgba(242,193,78,.4);background:rgba(242,193,78,.08)}
.st{cursor:pointer;font-weight:600}
.st.idea{color:#b9c9bf}
.st.buy{color:var(--gold);border-color:rgba(242,193,78,.4)}
.st.ordered{color:#7fc4ff;border-color:rgba(127,196,255,.4)}
.st.delivered{color:var(--mint);border-color:rgba(123,224,166,.4)}
.st.wrapped{color:#fff;background:var(--green);border-color:var(--green)}

.gift .top{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.gift .gname{font-weight:600;font-size:16px}
.gift .price{font-weight:700;font-size:17px;white-space:nowrap}
.gift .price s{display:block;color:var(--muted);font-weight:400;font-size:12px;text-align:right}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tiny{font-size:13px;padding:7px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);cursor:pointer}
.tiny:active{background:var(--card2)}
.notes{color:var(--muted);font-size:13px;margin-top:6px;white-space:pre-wrap}

/* buttons */
.btn-main{background:linear-gradient(135deg,var(--green),#23764a);border:0;color:#fff;font-weight:650;padding:13px 18px;border-radius:14px;cursor:pointer;width:100%;box-shadow:0 6px 18px rgba(47,143,91,.3)}
.btn-ghost{background:transparent;border:1px solid var(--line);padding:11px 16px;border-radius:14px;cursor:pointer;color:var(--text)}
.btn-danger{background:transparent;border:1px solid rgba(229,88,106,.5);color:var(--red);padding:11px 16px;border-radius:14px;cursor:pointer}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
.back{background:none;border:0;color:var(--mint);padding:6px 0;cursor:pointer;font-size:15px}
.empty{text-align:center;color:var(--muted);padding:34px 10px;border:1px dashed var(--line);border-radius:var(--radius)}
.empty .big{font-size:40px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(7,19,14,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 10px calc(8px + var(--safe-b));z-index:20}
nav div{max-width:640px;margin:0 auto;display:flex;gap:6px}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:6px 0;border-radius:12px;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:21px}
nav button.on{color:var(--mint);background:rgba(47,143,91,.15)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:92vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + var(--safe-b));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.panel h3{font-size:19px;margin-bottom:12px}
label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:12px 0 5px}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--mint)}
textarea{min-height:70px;resize:vertical}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.sugg{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sugg:last-child{border:0}
.sugg .t{flex:1;min-width:0}
.sugg h4{margin:16px 0 2px;font-size:13px;color:var(--gold);text-transform:uppercase;letter-spacing:.6px}
.plus{width:38px;height:38px;border-radius:50%;border:0;background:var(--green);color:#fff;font-size:22px;cursor:pointer;flex:none}
.plus.done{background:var(--bg2);color:var(--mint);border:1px solid var(--line)}
.snow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.snow i{position:absolute;top:-10px;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.35);animation:fall linear infinite}
@keyframes fall{to{transform:translateY(105vh) translateX(30px)}}
#app,nav{position:relative;z-index:1}
nav{position:fixed}
@media (prefers-reduced-motion:reduce){.snow{display:none}}
</style>
</head>
<body>
<div class="snow" id="snow"></div>
<div id="app"></div>
<nav><div>
  <button data-act="nav" data-v="people"><span>👥</span>People</button>
  <button data-act="nav" data-v="list"><span>🛒</span>Shopping</button>
  <button data-act="nav" data-v="settings"><span>⚙️</span>Settings</button>
</div></nav>
<div id="sheet"></div>

<script>
/* ---------- storage ---------- */
const KEY='spender-bender-v1';
const blank=()=>({budget:0,people:[],gifts:[]});
let S=load();
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.people&&d.gifts)return d}catch(e){}return blank()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Could not save — is storage blocked?')}}
const uid=()=>Math.random().toString(36).slice(2,10);

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(+n||0).toLocaleString('en-US',{style:'currency',currency:'USD',minimumFractionDigits:(+n||0)%1?2:0,maximumFractionDigits:2});
const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.]/g,''));return isNaN(n)?0:n};
const today=()=>new Date().toISOString().slice(0,10);
const STATUS=[['idea','💡 Idea'],['buy','🛍 To buy'],['ordered','📦 Ordered'],['delivered','🏠 Arrived'],['wrapped','🎀 Wrapped']];
const SPENT=['ordered','delivered','wrapped'];
const total=g=>num(g.price)+num(g.ship);
const isSpent=g=>SPENT.includes(g.status);
function host(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return''}}
function fixUrl(u){u=(u||'').trim();if(!u)return'';return /^https?:\/\//i.test(u)?u:'https://'+u}
function daysToXmas(){const n=new Date();let x=new Date(n.getFullYear(),11,25);if(n>x)x=new Date(n.getFullYear()+1,11,25);return Math.ceil((x-n)/864e5)}
function personStats(p){
  const gs=S.gifts.filter(g=>g.pid===p.id);
  const spent=gs.filter(isSpent).reduce((a,g)=>a+total(g),0);
  const planned=gs.filter(g=>!isSpent(g)&&g.status!=='idea').reduce((a,g)=>a+total(g),0);
  const ideas=gs.filter(g=>g.status==='idea').reduce((a,g)=>a+total(g),0);
  return{gs,spent,planned,ideas,committed:spent+planned};
}
function allStats(){
  let spent=0,planned=0,ideas=0,budgets=0;
  S.people.forEach(p=>{const s=personStats(p);spent+=s.spent;planned+=s.planned;ideas+=s.ideas;budgets+=num(p.budget)});
  const cap=num(S.budget)||budgets;
  return{spent,planned,ideas,cap,left:cap-spent-planned};
}
function priceTrend(g){
  const h=g.history||[];if(h.length<2)return null;
  const d=h[h.length-1].p-h[0].p;if(!d)return null;return d;
}

/* ---------- state / routing ---------- */
let view={t:'people'};
let filter='all';
function go(v){view=v;render();window.scrollTo(0,0)}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===(view.t==='person'?'people':view.t)));
  const app=$('#app');
  app.innerHTML=header()+({people:vPeople,person:vPerson,list:vList,settings:vSettings}[view.t])();
}
function header(){
  const a=allStats();
  const pct=a.cap?Math.min(100,(a.spent/a.cap)*100):0;
  const pct2=a.cap?Math.min(100-pct,(a.planned/a.cap)*100):0;
  const over=a.cap&&a.left<0;
  return `<div class="hero">
    <div class="brand"><h1>🎄 Spender <span>Bender</span></h1><div class="count">🎅 ${daysToXmas()} days</div></div>
    <div class="stats">
      <div class="stat good"><small>Spent</small><b>${money(a.spent)}</b></div>
      <div class="stat ${over?'warn':''}"><small>${over?'Over budget':'Left to spend'}</small><b>${a.cap?money(Math.abs(a.left)):'—'}</b></div>
    </div>
    <div class="bar" style="display:flex"><i class="${over?'over':''}" style="width:${pct}%"></i><i class="plan" style="width:${pct2}%;border-radius:0"></i></div>
    <div class="barlbl"><span>${money(a.spent)} spent · ${money(a.planned)} planned</span><span>${a.cap?'of '+money(a.cap):'set a budget in Settings'}</span></div>
  </div>`;
}
function vPeople(){
  const cards=S.people.map(p=>{
    const s=personStats(p),b=num(p.budget),over=b&&s.committed>b;
    const pct=b?Math.min(100,s.committed/b*100):0;
    const n=s.gs.length,done=s.gs.filter(g=>g.status==='wrapped').length;
    return `<div class="card tap" data-act="person" data-id="${p.id}">
      <div class="prow"><div class="avatar">${esc(p.emoji||'🎁')}</div>
        <div class="grow"><div class="name">${esc(p.name)}</div>
          <div class="sub">${p.age?esc(p.age)+' yrs · ':''}${n} gift${n===1?'':'s'}${n?` · ${done} wrapped`:''}</div></div>
        <div class="right"><b>${money(s.committed)}</b><div class="sub">${b?'of '+money(b):'no budget'}</div></div></div>
      ${b?`<div class="bar"><i class="${over?'over':''}" style="width:${pct}%"></i></div>`:''}
    </div>`}).join('');
  return `<div class="sec"><h2>Gift recipients</h2></div>
    ${cards||`<div class="empty"><div class="big">🎁</div><p>No one on your list yet.<br>Add the first person you're shopping for.</p></div>`}
    <button class="btn-main" data-act="addPerson">＋ Add person</button>`;
}
function giftCard(g,showPerson){
  const p=S.people.find(x=>x.id===g.pid);
  const tr=priceTrend(g);
  const h=host(g.url);
  const atTarget=num(g.target)&&num(g.price)&&num(g.price)<=num(g.target);
  return `<div class="card gift">
    <div class="top"><div class="grow"><div class="gname">${esc(g.name)}</div>
      ${showPerson&&p?`<div class="sub">for ${esc(p.emoji||'')} ${esc(p.name)}</div>`:''}</div>
      <div class="price">${num(g.price)?money(g.price):'—'}${num(g.ship)?`<s>+ ${money(g.ship)} ship</s>`:''}</div></div>
    <div class="chips">
      <span class="chip btn st ${g.status}" data-act="cycle" data-id="${g.id}">${STATUS.find(s=>s[0]===g.status)[1]}</span>
      <span class="chip">${g.where==='store'?'📍':'🌐'} ${esc(g.store||(g.where==='store'?'In store':h)||'Online')}</span>
      ${tr?`<span class="chip ${tr<0?'drop':'rise'}">${tr<0?'▼':'▲'} ${money(Math.abs(tr))} since added</span>`:''}
      ${atTarget?`<span class="chip target">🎯 At target ${money(g.target)}</span>`:(num(g.target)?`<span class="chip">target ${money(g.target)}</span>`:'')}
      ${g.url?`<a class="chip link" href="${esc(g.url)}" target="_blank" rel="noopener noreferrer">${esc(h||'link')} ↗</a>`:''}
    </div>
    ${g.notes?`<div class="notes">${esc(g.notes)}</div>`:''}
    <div class="acts"><button class="tiny" data-act="price" data-id="${g.id}">💲 Update price</button>
      <button class="tiny" data-act="editGift" data-id="${g.id}">✏️ Edit</button></div>
  </div>`;
}
function vPerson(){
  const p=S.people.find(x=>x.id===view.id);if(!p){view={t:'people'};return vPeople()}
  const s=personStats(p),b=num(p.budget);
  const left=b-s.committed;
  const gifts=s.gs.slice().sort((a,b)=>STATUS.findIndex(x=>x[0]===a.status)-STATUS.findIndex(x=>x[0]===b.status));
  return `<button class="back" data-act="nav" data-v="people">‹ All people</button>
  <div class="card"><div class="prow"><div class="avatar">${esc(p.emoji||'🎁')}</div>
    <div class="grow"><div class="name">${esc(p.name)}</div><div class="sub">${p.age?esc(p.age)+' yrs old':'age not set'}</div></div>
    <button class="tiny" data-act="editPerson" data-id="${p.id}">Edit</button></div>
    ${(p.likes||[]).length?`<div class="chips">${p.likes.map(l=>`<span class="chip">${esc(l)}</span>`).join('')}</div>`:''}
    ${p.notes?`<div class="notes">${esc(p.notes)}</div>`:''}
    <div class="stats" style="margin-top:12px">
      <div class="stat"><small>Committed</small><b>${money(s.committed)}</b></div>
      <div class="stat ${b&&left<0?'warn':'good'}"><small>${b?(left<0?'Over by':'Left'):'Budget'}</small><b>${b?money(Math.abs(left)):'—'}</b></div>
    </div></div>
  <div class="row2" style="margin-bottom:6px"><button class="btn-main" data-act="addGift" data-pid="${p.id}">＋ Add gift</button>
    <button class="btn-ghost" data-act="suggest" data-id="${p.id}">✨ Ideas</button></div>
  <div class="sec"><h2>Gifts (${gifts.length})</h2></div>
  ${gifts.map(g=>giftCard(g)).join('')||`<div class="empty"><div class="big">✨</div><p>Nothing here yet. Add a gift, or tap <b>Ideas</b> for suggestions based on ${esc(p.name)}'s age &amp; interests.</p></div>`}`;
}
function vList(){
  const f={all:()=>true,todo:g=>g.status==='idea'||g.status==='buy',ordered:g=>g.status==='ordered'||g.status==='delivered',wrapped:g=>g.status==='wrapped',store:g=>g.where==='store'&&!isSpent(g),drops:g=>(priceTrend(g)||0)<0||(num(g.target)&&num(g.price)<=num(g.target))};
  const chips=[['all','All'],['todo','Still to buy'],['ordered','On the way'],['wrapped','Wrapped'],['store','📍 In-store'],['drops','🔥 Deals']];
  const gs=S.gifts.filter(f[filter]).sort((a,b)=>(S.people.find(p=>p.id===a.pid)?.name||'').localeCompare(S.people.find(p=>p.id===b.pid)?.name||''));
  return `<div class="sec"><h2>Shopping list</h2><span class="sub">${gs.length} item${gs.length===1?'':'s'} · ${money(gs.reduce((a,g)=>a+total(g),0))}</span></div>
  <div class="chips" style="margin:0 0 14px">${chips.map(c=>`<span class="chip btn ${filter===c[0]?'on':''}" data-act="filter" data-f="${c[0]}">${c[1]}</span>`).join('')}</div>
  ${gs.map(g=>giftCard(g,true)).join('')||`<div class="empty"><div class="big">🛒</div><p>Nothing matches this filter.</p></div>`}`;
}
function vSettings(){
  const a=allStats();
  return `<div class="sec"><h2>Settings</h2></div>
  <div class="card"><label style="margin-top:0">Overall Christmas budget</label>
    <input id="budget" inputmode="decimal" placeholder="Leave blank to add up each person's budget" value="${num(S.budget)||''}">
    <div class="hint">Currently using ${money(a.cap)}${num(S.budget)?'':' (sum of individual budgets)'}.</div>
    <button class="btn-main" style="margin-top:12px" data-act="saveBudget">Save budget</button></div>
  <div class="card"><h3 style="font-size:16px">Backup</h3>
    <p class="sub">Your list is saved only in this browser. Export a backup now and then — especially before clearing browser data or switching phones.</p>
    <div class="row2"><button class="btn-ghost" data-act="export">⬇️ Export</button><button class="btn-ghost" data-act="import">⬆️ Import</button></div>
    <input type="file" id="file" accept="application/json" style="display:none"></div>
  <div class="card"><h3 style="font-size:16px">Status guide</h3>
    <p class="sub">💡 Idea &amp; 🛍 To buy count as <b>planned</b>. 📦 Ordered, 🏠 Arrived &amp; 🎀 Wrapped count as <b>spent</b>. Tap a status chip on any gift to move it forward.</p></div>
  <button class="btn-danger" data-act="reset" style="width:100%">Erase everything</button>`;
}

/* ---------- sheets ---------- */
function sheet(html){const s=$('#sheet');s.innerHTML=`<div class="scrim" data-act="close"></div><div class="panel">${html}</div>`;s.classList.add('open');document.body.style.overflow='hidden'}
function closeSheet(){$('#sheet').classList.remove('open');$('#sheet').innerHTML='';document.body.style.overflow=''}

const EMOJIS=['🎁','👩','👨','👧','👦','👶','👵','👴','🧑','🐶','🐱','🎅','🤶','⭐'];
const LIKE_CHIPS=['Gaming','Books','Cooking','Baking','Coffee','Fitness','Hiking','Music','Art','Tech','Movies','Pets','Gardening','Travel','Fashion','Skincare','Sports','LEGO','Board games','Photography','Cozy home','Wine','Golf','Fishing','Cars','Science','Dolls','Camping'];

function personForm(p){
  p=p||{};
  sheet(`<h3>${p.id?'Edit person':'Add person'}</h3>
  <form data-form="person" data-id="${p.id||''}">
    <label>Name</label><input name="name" required value="${esc(p.name)}" placeholder="Mom, Jake, Aunt Lisa…">

function priceSheet(g){

}

function suggestFor(p){
  const age=p.age===''||p.age==null?null:num(p.age);
  const okAge=i=>age==null||(age>=i[1]&&age<=i[2]);
  const out=[],seen=new Set(S.gifts.filter(g=>g.pid===p.id).map(g=>g.name.toLowerCase()));
  const used=new Set();
  const addGroup=(title,items)=>{const it=items.filter(okAge).filter(i=>!seen.has(i[0].toLowerCase())&&!used.has(i[0]));if(it.length){it.forEach(i=>used.add(i[0]));out.push({title,items:it.slice(0,6)})}};
  const unmatched=[];
  (p.likes||[]).forEach(l=>{
    const t=l.toLowerCase().trim();if(t.length<3){return}
    let hit=false;
    IDEAS.forEach(c=>{if(c[1].some(w=>t.includes(w)||w.includes(t))||c[0].toLowerCase().includes(t)){hit=true;addGroup(`Because they like ${l}`,c[2])}});
    if(!hit)unmatched.push(l);
  });
  BY_AGE.forEach(a=>{if(age==null||(age>=a[1]&&age<=a[2]))addGroup(age==null?`Crowd-pleasers: ${a[0]}`:`Safe bets for age ${age}`,a[3])});
  return{groups:out,unmatched,age};
}
function suggestSheet(p){
  const r=suggestFor(p);
  const q=encodeURIComponent;
  sheet(`<h3>✨ Ideas for ${esc(p.name)}</h3>
  <p class="sub" style="margin-top:-6px">${r.age!=null?`Age ${r.age}`:'No age set'} · ${(p.likes||[]).length?esc(p.likes.join(', ')):'no interests yet — edit the person to add some'}. Prices are rough estimates.</p>
  ${r.groups.map(g=>`<h4 class="sugg" style="border:0;padding:0"></h4><div style="color:var(--gold);font-size:13px;text-transform:uppercase;letter-spacing:.6px;margin:16px 0 2px">${esc(g.title)}</div>
    ${g.items.map(i=>`<div class="sugg"><div class="t"><div style="font-weight:600">${esc(i[0])}</div><div class="sub">~${money(i[3])} · <a href="https://www.google.com/search?tbm=shop&q=${q(i[0])}" target="_blank" rel="noopener noreferrer">compare prices ↗</a></div></div>
    <button class="plus" data-act="addIdea" data-id="${p.id}" data-n="${esc(i[0])}" data-p="${i[3]}">＋</button></div>`).join('')}`).join('')||'<div class="empty">No ideas left — you have them all covered!</div>'}
  ${r.unmatched.length?`<div style="color:var(--gold);font-size:13px;text-transform:uppercase;letter-spacing:.6px;margin:16px 0 6px">Search for the rest</div>
    <div class="chips">${r.unmatched.map(l=>`<a class="chip link" target="_blank" rel="noopener noreferrer" href="https://www.google.com/search?q=${q('gift ideas for '+(r.age!=null?r.age+' year old ':'')+'who likes '+l)}">${esc(l)} ↗</a>`).join('')}</div>`:''}
  <button class="btn-ghost" style="width:100%;margin-top:16px" data-act="close">Done</button>`);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,id=t.dataset.id;
  const gift=()=>S.gifts.find(g=>g.id===id),person=()=>S.people.find(p=>p.id===id);
  switch(a){
    case'nav':go({t:t.dataset.v});break;
    case'close':closeSheet();break;
    case'person':go({t:'person',id});break;
    case'addPerson':personForm();break;
    case'editPerson':personForm(person());break;
    case'addLike':{const i=$('#likes');const cur=i.value.split(',').map(s=>s.trim()).filter(Boolean);if(!cur.some(c=>c.toLowerCase()===t.dataset.l.toLowerCase())){cur.push(t.dataset.l);i.value=cur.join(', ')}t.classList.add('on');break}
    case'delPerson':if(confirm('Delete this person and all their gifts?')){S.people=S.people.filter(p=>p.id!==id);S.gifts=S.gifts.filter(g=>g.pid!==id);save();closeSheet();go({t:'people'})}break;
    case'addGift':giftForm(null,t.dataset.pid);break;
    case'editGift':giftForm(gift());break;
    case'delGift':if(confirm('Delete this gift?')){S.gifts=S.gifts.filter(g=>g.id!==id);save();closeSheet();render()}break;
    case'price':priceSheet(gift());break;
    case'cycle':{const g=gift();const i=STATUS.findIndex(s=>s[0]===g.status);g.status=STATUS[(i+1)%STATUS.length][0];save();render();break}
    case'filter':filter=t.dataset.f;render();break;
    case'suggest':suggestSheet(person());break;
    case'addIdea':{S.gifts.push({id:uid(),pid:id,name:t.dataset.n,url:'',where:'online',store:'',price:+t.dataset.p,ship:0,target:0,status:'idea',notes:'',history:[{p:+t.dataset.p,d:today()}],added:today()});save();t.classList.add('done');t.textContent='✓';t.disabled=true;render();break}
    case'saveBudget':S.budget=num($('#budget').value);save();render();break;
    case'export':{const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a2=document.createElement('a');a2.href=URL.createObjectURL(b);a2.download='spender-bender-backup-'+today()+'.json';a2.click();break}
    case'import':$('#file').click();break;
    case'reset':if(confirm('Erase ALL people and gifts? This cannot be undone.')){S=blank();save();go({t:'people'})}break;
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='file'){
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.people||!d.gifts)throw 0;if(confirm('Replace your current list with this backup?')){S=d;save();go({t:'people'})}}catch(x){alert('That file is not a valid backup.')}};r.readAsText(f);
  }
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  const d=Object.fromEntries(new FormData(f)),id=f.dataset.id;
  if(f.dataset.form==='person'){
    const o={name:d.name.trim(),emoji:d.emoji,age:d.age.trim(),budget:num(d.budget),likes:d.likes.split(',').map(s=>s.trim()).filter(Boolean),notes:d.notes.trim()};
    if(id)Object.assign(S.people.find(p=>p.id===id),o);else{o.id=uid();S.people.push(o);view={t:'person',id:o.id}}
  }else if(f.dataset.form==='gift'){
    const url=fixUrl(d.url),price=num(d.price);
    const o={name:d.name.trim(),url,where:d.where,store:d.store.trim()||(d.where==='online'?host(url):''),price,ship:num(d.ship),target:num(d.target),status:d.status,notes:d.notes.trim()};
    if(id){const g=S.gifts.find(x=>x.id===id);if(price!==num(g.price)&&price)(g.history=g.history||[]).push({p:price,d:today()});Object.assign(g,o)}
    else{o.id=uid();o.pid=f.dataset.pid;o.added=today();o.history=price?[{p:price,d:today()}]:[];S.gifts.push(o)}
  }else if(f.dataset.form==='price'){
    const g=S.gifts.find(x=>x.id===id),p=num(d.price);
    if(p&&p!==num(g.price)){g.price=p;(g.history=g.history||[]).push({p,d:today()})}
  }
  save();closeSheet();render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
